<!DOCTYPE html>
<html>
<head>
    <title>Excel Replacement</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #matrix-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: -1; /* Place it behind other content */
        }
        /* Add styles for your main content here */
        #app {
            position: relative;
            z-index: 1;
            /* Add other styles as needed */
        }
    </style>
</head>
<body>
    <iframe id="matrix-iframe" src="https://rezmason.github.io/matrix/"></iframe>
    <div id="background-overlay"></div>
    <div id="app">
        <div class="container">
            <h1>Excel Template Processor</h1>
            
            <div class="form-group">
                <label for="templateType">Template Type:</label>
                <select id="templateType">
                    <option value="excel">Excel</option>
                    <option value="word">Word</option>
                </select>
            </div>

            <div class="form-group">
                <label for="csvFile">CSV File:</label>
                <div class="input-group">
                    <input type="text" id="csvFile" readonly>
                    <button id="browseCsv">Browse...</button>
                </div>
            </div>

            <div class="form-group">
                <label for="templateFile">Template File:</label>
                <div class="input-group">
                    <input type="text" id="templateFile" readonly>
                    <button id="browseTemplate">Browse...</button>
                </div>
            </div>

            <div class="form-group">
                <label for="outputDir">Output Directory:</label>
                <div class="input-group">
                    <input type="text" id="outputDir" readonly>
                    <button id="browseOutput">Browse...</button>
                </div>
            </div>

            <div class="button-group">
                <button id="configureFileName">Configure File Name Pattern</button>
                <button id="preview">Preview</button>
                <button id="manageTemplates">Manage Templates</button>
            </div>

            <button id="process" class="process-button">Process Files</button>

            <div id="status" class="status"></div>
        </div>

        <div id="progressModal" class="modal">
            <div class="modal-content">
                <h2>Processing Files</h2>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                    <div class="progress-text">Processing file 0 of 0</div>
                    <div class="current-file"></div>
                </div>
                <button id="doneButton" style="display: none;">Done</button>
            </div>
        </div>
    </div>
    <script src="./dist/renderer.js"></script>
</body>
</html>
