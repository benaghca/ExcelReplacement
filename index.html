<!DOCTYPE html>
<html>
<head>
    <title>Document Template Processor</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>Document Template Processor</h1>
            <p class="text-center text-muted mb-5">Process Excel and Word templates with CSV data</p>
            
            <div class="form-group">
                <label for="templateType">Template Type:</label>
                <select id="templateType">
                    <option value="excel">Excel</option>
                    <option value="word">Word</option>
                </select>
            </div>

            <div class="form-group">
                <label for="csvFile">CSV File:</label>
                <div class="input-group">
                    <input type="text" id="csvFile" readonly>
                    <button id="browseCsv">Browse...</button>
                </div>
                <div class="drop-zone" id="csvDropZone">
                    <div class="drop-zone-content">
                        <div class="drop-zone-icon">📄</div>
                        <div class="drop-zone-text">Drop CSV file here or click Browse</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="templateFile">Template File:</label>
                <div class="input-group">
                    <input type="text" id="templateFile" readonly>
                    <button id="browseTemplate">Browse...</button>
                </div>
                <div class="drop-zone" id="templateDropZone">
                    <div class="drop-zone-content">
                        <div class="drop-zone-icon">📊</div>
                        <div class="drop-zone-text">Drop Excel/Word template here or click Browse</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="outputDir">Output Directory:</label>
                <div class="input-group">
                    <input type="text" id="outputDir" readonly>
                    <button id="browseOutput">Browse...</button>
                </div>
                <div class="drop-zone" id="outputDropZone">
                    <div class="drop-zone-content">
                        <div class="drop-zone-icon">📁</div>
                        <div class="drop-zone-text">Drop folder here or click Browse</div>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="configureFileName">Configure File Name</button>
                <button id="preview">Preview</button>
                <button id="manageTemplates">Manage Templates</button>
                <button id="settings" class="btn-secondary">⚙️ Settings</button>
            </div>

            <button id="process" class="process-button">Process Files</button>

            <div id="status" class="status"></div>
        </div>

        <div id="progressModal" class="modal">
            <div class="modal-content">
                <h2>Processing Files</h2>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                    <div class="progress-text">Processing file 0 of 0</div>
                    <div class="current-file"></div>
                </div>
                <button id="doneButton" style="display: none;">Done</button>
            </div>
        </div>
    </div>
    <script src="./app.js"></script>
    <script>
        // Test Electron API availability
        setTimeout(() => {
            console.log('=== ELECTRON API TEST ===');
            console.log('window.require:', window.require);
            console.log('typeof window.require:', typeof window.require);
            
            if (window.require) {
                console.log('Electron API is available!');
                document.getElementById('status').textContent = 'Electron API is available!';
                document.getElementById('status').className = 'status success';
            } else {
                console.log('Electron API is NOT available');
                document.getElementById('status').textContent = 'Electron API is NOT available - check console for errors';
                document.getElementById('status').className = 'status error';
            }
            document.getElementById('status').style.display = 'block';
        }, 2000);
    </script>
</body>
</html>
